<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The seal's diamond, as the site mark. Brass in dark tabs, deep brass in
       light tabs — the same per-theme pairing the site's tokens use. -->
  <style>
    .mark { fill: none; stroke: #b08d57; stroke-width: 3.5; }
    .core { fill: #b08d57; }
    @media (prefers-color-scheme: light) {
      .mark { stroke: #7a5c2e; }
      .core { fill: #7a5c2e; }
    }
  </style>
  <rect class="mark" x="14.9" y="14.9" width="34.2" height="34.2" transform="rotate(45 32 32)" />
  <rect class="core" x="26.35" y="26.35" width="11.3" height="11.3" transform="rotate(45 32 32)" />
</svg>

# Production deploys.
#
# Why CI deploys instead of Vercel's git integration: the Vercel team
# (integrant-au, Hobby plan) cannot auto-deploy from a private GitHub
# organization repo, and Hobby also blocks deployments attributed to a
# commit author who is not the team's own account. So this workflow
# builds the site here, strips git attribution, and uploads the prebuilt
# output with the Vercel CLI — which the team token is allowed to do.
#
# Secrets: VERCEL_TOKEN (team-scoped), VERCEL_ORG_ID, VERCEL_PROJECT_ID.
name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false # never kill a mid-flight upload; stale queued runs are superseded

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  deploy:
    # workflow_dispatch from a non-main branch must never reach production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # version read from package.json "packageManager"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          PUBLIC_SITE_LIVE: 'true' # baked into HTML/robots.txt at build time
        run: pnpm build

      # `--prebuilt` deploys ignore vercel.json, so its redirect and security
      # headers must be merged into the build output here (the job `vercel
      # build` normally does, unavailable to the team-scoped token).
      - name: Merge vercel.json routes into build output
        run: node scripts/merge-vercel-config.mjs

      - name: Link build output to the Vercel project
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s","projectName":"chaos-to-creation"}' \
            "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json

      - name: Deploy prebuilt output to production
        env:
          CI_COMMIT: ${{ github.sha }}
          CI_REF: ${{ github.ref_name }}
          CI_RUN: ${{ github.run_id }}
        run: |
          # Hobby teams block deploys attributed to a non-owner commit author.
          # Remove the git dir so the CLI attaches no author metadata; the
          # commit travels as custom meta instead.
          rm -rf .git
          url=$(pnpm exec vercel deploy --prebuilt --prod --yes --no-color \
            -m "ciCommit=$CI_COMMIT" -m "ciRef=$CI_REF" -m "ciRun=$CI_RUN" \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployed: $url"
          { echo "### Production deploy"
            echo "- Deployment: $url"
            echo "- Commit: $CI_COMMIT"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test production
        run: |
          sleep 10
          curl -sSfL -o /dev/null https://chaostocreation.com.au/
          curl -sSfL -o /dev/null https://chaostocreation.com.au/media/
          # PUBLIC_SITE_LIVE must have been baked in: robots.txt may not disallow the site root
          ! curl -sSfL https://chaostocreation.com.au/robots.txt | grep -q '^Disallow: /$'
          # vercel.json rules must have survived the prebuilt deploy
          code=$(curl -s -o /dev/null -w '%{http_code}' https://www.chaostocreation.com.au/press/)
          [ "$code" = "308" ] || { echo "/press/ returned $code, expected 308"; exit 1; }
          curl -sSI https://www.chaostocreation.com.au/ | grep -qi '^content-security-policy:' \
            || { echo "security headers missing from production"; exit 1; }
